<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Endless Survivor</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#7d8095;--panel:#1d2033;--ink:#fff;--lime:#9be15d;--hp:#ff5d63;--gold:#ffc94a;color-scheme:dark;box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Lilita One","Trebuchet MS",Arial,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0 56px;pointer-events:none}
#pb{position:fixed;left:8px;top:calc(env(safe-area-inset-top,0px) + 8px);width:42px;height:42px;border-radius:12px;border:2px solid #fff;background:var(--panel);color:#fff;font:22px "Lilita One",Arial;display:none;cursor:pointer;padding:0}
#row{display:flex;justify-content:space-between;align-items:center;font-size:22px;text-shadow:0 2px 0 #0007}
#time{font-size:34px}
#lv,#kl{background:#1d2033cc;border:2px solid #fff6;border-radius:999px;padding:2px 12px;font-size:18px}
.bar{height:16px;background:var(--panel);border:2px solid #fff;border-radius:10px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4cc95a,#d4f55a);transition:width .12s}
#hpb i{background:linear-gradient(90deg,#e0364c,#ff8a5d)}
#hpb{height:14px;width:60%}
#warn{position:fixed;left:0;right:0;top:32%;display:none;flex-direction:column;align-items:center;pointer-events:none;text-shadow:0 3px 0 #000a;animation:wf .45s infinite alternate}
#warn b{font-weight:400;font-size:46px}#warn span{font-size:24px;color:#fff}
@keyframes wf{from{opacity:.5}to{opacity:1}}
#bb{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:none;pointer-events:none;text-align:center;font-size:18px;text-shadow:0 2px 0 #000a}
#bbf{background:linear-gradient(90deg,#8b1e2d,#ff5d63)}
#cds{display:flex;gap:8px;margin-top:6px}
.cd{position:relative;display:none;align-items:center;min-width:96px;height:26px;border:2px solid #fff6;border-radius:999px;background:#1d2033cc;overflow:hidden;font-size:14px;text-shadow:0 1px 0 #000a}
.cd i{position:absolute;left:0;top:0;bottom:0;width:0;background:#4aa8ff88}
.cd span{position:relative;padding:0 10px;white-space:nowrap}
.cd.rdy{border-color:#9be15d;box-shadow:0 0 10px #9be15d99}
.cd.rdy i{background:#9be15d55}
#ov{position:fixed;inset:0;display:none;flex-direction:column;justify-content:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 16px);background:#10121fd9;backdrop-filter:blur(6px);animation:fi .2s}
@keyframes fi{from{opacity:0}}
#ov h1{margin:0 0 4px;text-align:center;font-weight:400;font-size:38px;color:var(--gold);text-shadow:0 4px 0 #0009}
#ov p{margin:0;text-align:center;font-size:20px}
.opt{background:linear-gradient(180deg,#2a2f4a,#1d2033);border:3px solid var(--lime);border-radius:18px;padding:14px 18px;color:#fff;font:inherit;text-align:left;cursor:pointer;box-shadow:0 5px 0 #0006,0 0 18px #9be15d22;transition:transform .1s}
.opt b{display:block;font-weight:400;font-size:24px;color:var(--lime)}
.opt span{font-size:18px;opacity:.85}
.opt input[type=range]{width:100%;margin-top:12px;accent-color:#9be15d}
#ov{overflow-y:auto}
.inv{margin:auto 0;display:flex;flex-direction:column;gap:10px}
.it{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#2a2f4a,#1d2033);border:3px solid #888;border-radius:16px;padding:10px 12px}
.it .ic{font-size:30px}.it .tx{flex:1;line-height:1.15}.it .tx b{font-weight:400;font-size:20px;display:block}.it .tx span{font-size:14px;opacity:.8}
.it .bt{display:flex;flex-direction:column;gap:6px}
.it button{font:inherit;font-size:15px;color:#fff;background:#2f365a;border:2px solid #fff8;border-radius:12px;padding:6px 10px;cursor:pointer}
.chip{font:inherit;font-size:15px;color:#fff;background:#2f365a;border:2px solid #fff8;border-radius:12px;padding:6px 12px;cursor:pointer}
.opt input[type=number]{width:84px;font:inherit;font-size:18px;color:#fff;background:#10121f;border:2px solid #fff8;border-radius:10px;padding:4px 8px;text-align:right}
.it button.on{border-color:#9be15d;color:#9be15d}.it button:disabled{opacity:.7}
.opt:active{transform:scale(.97);background:#2b3050}
.inv2{flex:1;min-height:0;width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.ov1{flex:0 0 auto;border:3px solid var(--c);border-radius:16px;background:linear-gradient(180deg,#2a2f4a,#1d2033);box-shadow:0 0 18px rgba(var(--rgb),.6);padding:12px;display:flex;flex-direction:column;gap:10px}
.ovt{display:flex;align-items:center;gap:14px}
.ovt .big{font-size:54px;line-height:1;filter:drop-shadow(0 0 10px rgba(var(--rgb),.9))}
.ovt .info{flex:1;line-height:1.15}.ovt .info b{display:block;font-weight:400;font-size:26px;color:var(--c)}.ovt .info span{font-size:16px;opacity:.9}
.acts{display:flex;gap:8px}
.acts button{flex:1;font:inherit;font-size:17px;color:#fff;background:#2f365a;border:2px solid #fff8;border-radius:12px;padding:8px 6px;cursor:pointer}
.acts button.on{border-color:#9be15d;color:#9be15d}.acts button:disabled{opacity:.6;cursor:default}.acts button small{opacity:.8;font-size:12px}
#ov p.im{color:#9be15d;font-size:15px}
.grid{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-content:start;padding:10px;border:3px solid #fff4;border-radius:16px;background:#0f1120aa}
.tl{position:relative;aspect-ratio:1;border-radius:12px;border:3px solid var(--c);background:linear-gradient(180deg,#2a2f4a,#1d2033);box-shadow:0 0 10px rgba(var(--rgb),.7),inset 0 0 10px rgba(var(--rgb),.25);cursor:pointer;padding:0;color:#fff;font:inherit;display:flex;align-items:center;justify-content:center}
.tl .ti{font-size:26px}.tl em{position:absolute;right:3px;bottom:0;font-style:normal;font-size:12px;text-shadow:0 1px 0 #000}
.tl .tm{position:absolute;left:3px;top:0;font-style:normal;font-size:11px;color:var(--c)}.tl .te{position:absolute;right:3px;top:0;font-style:normal;font-size:11px;color:#9be15d}
.tl.on{transform:scale(1.08);outline:3px solid #fff;outline-offset:1px;z-index:1}
.bot{flex:0 0 auto;display:flex;gap:10px;align-items:center}
.bot .back{font:inherit;font-size:20px;color:#fff;background:linear-gradient(180deg,#2a2f4a,#1d2033);border:3px solid #fff8;border-radius:14px;padding:10px 22px;cursor:pointer}
.bot .chb{flex:1;font:inherit;font-size:18px;color:var(--gold);background:linear-gradient(180deg,#2a2f4a,#1d2033);border:3px solid var(--gold);border-radius:14px;padding:10px;cursor:pointer}
.bot .nochest{flex:1;text-align:right;font-size:14px;opacity:.75}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div id="row"><span id="lv">Lv 1</span><span id="time">00:00</span><span id="kl">0 kills</span></div>
<div class="bar"><i id="xpf"></i></div>
<div class="bar" id="hpb"><i id="hpf" style="width:100%"></i></div><div id="hpt" style="font-size:15px;margin-top:2px;text-shadow:0 2px 0 #0007"></div><div id="cds"><div class="cd" id="cdd"><i></i><span></span></div><div class="cd" id="cdm"><i></i><span></span></div></div></div>
<button id="pb" aria-label="Menu">☰</button><div id="warn"><b id="wb">⚠ WARNING ⚠</b><span id="wt"></span></div><div id="bb"><span>Giant Zombie</span><div class="bar"><i id="bbf"></i></div></div><div id="ov"></div>
