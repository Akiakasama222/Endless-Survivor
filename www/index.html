<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Endless Survivor</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#7d8095;--panel:#1d2033;--ink:#fff;--lime:#9be15d;--hp:#ff5d63;--gold:#ffc94a;color-scheme:dark;box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Lilita One","Trebuchet MS",Arial,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0 56px;pointer-events:none}
#pb{position:fixed;left:8px;top:calc(env(safe-area-inset-top,0px) + 8px);width:42px;height:42px;border-radius:12px;border:2px solid #fff;background:var(--panel);color:#fff;font:22px "Lilita One",Arial;display:none;cursor:pointer;padding:0}
#row{display:flex;justify-content:space-between;align-items:center;font-size:22px;text-shadow:0 2px 0 #0007}
#time{font-size:34px}
#lv,#kl{background:#1d2033cc;border:2px solid #fff6;border-radius:999px;padding:2px 12px;font-size:18px}
.bar{height:16px;background:var(--panel);border:2px solid #fff;border-radius:10px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4cc95a,#d4f55a);transition:width .12s}
#hpb i{background:linear-gradient(90deg,#e0364c,#ff8a5d)}
#hpb{height:14px;width:60%}
#cds{display:flex;gap:8px;margin-top:6px}
.cd{position:relative;display:none;align-items:center;min-width:96px;height:26px;border:2px solid #fff6;border-radius:999px;background:#1d2033cc;overflow:hidden;font-size:14px;text-shadow:0 1px 0 #000a}
.cd i{position:absolute;left:0;top:0;bottom:0;width:0;background:#4aa8ff88}
.cd span{position:relative;padding:0 10px;white-space:nowrap}
.cd.rdy{border-color:#9be15d;box-shadow:0 0 10px #9be15d99}
.cd.rdy i{background:#9be15d55}
#ov{position:fixed;inset:0;display:none;flex-direction:column;justify-content:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 16px);background:#10121fd9;backdrop-filter:blur(6px);animation:fi .2s}
@keyframes fi{from{opacity:0}}
#ov h1{margin:0 0 4px;text-align:center;font-weight:400;font-size:38px;color:var(--gold);text-shadow:0 4px 0 #0009}
#ov p{margin:0;text-align:center;font-size:20px}
.opt{background:linear-gradient(180deg,#2a2f4a,#1d2033);border:3px solid var(--lime);border-radius:18px;padding:14px 18px;color:#fff;font:inherit;text-align:left;cursor:pointer;box-shadow:0 5px 0 #0006,0 0 18px #9be15d22;transition:transform .1s}
.opt b{display:block;font-weight:400;font-size:24px;color:var(--lime)}
.opt span{font-size:18px;opacity:.85}
.opt:active{transform:scale(.97);background:#2b3050}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div id="row"><span id="lv">Lv 1</span><span id="time">00:00</span><span id="kl">0 kills</span></div>
<div class="bar"><i id="xpf"></i></div>
<div class="bar" id="hpb"><i id="hpf" style="width:100%"></i></div><div id="hpt" style="font-size:15px;margin-top:2px;text-shadow:0 2px 0 #0007"></div><div id="cds"><div class="cd" id="cdd"><i></i><span></span></div><div class="cd" id="cdm"><i></i><span></span></div></div></div>
<button id="pb" aria-label="Menu">☰</button><div id="ov"></div>

 for(const t of S.tx)t.t-=dt;for(const f of S.fx)f.t-=dt;S.fx=S.fx.filter(f=>f.t>0);if(S.hf>0)S.hf-=dt;for(const p of S.dtr)p.t-=dt;S.dtr=S.dtr.filter(p=>p.t>0);for(const p of S.tr)p.t-=dt;cull(S.tr,p=>p.t>0);if(S.tr.length>260)S.tr.splice(0,S.tr.length-260);swingStep(dt);for(const f of S.sl){f.t+=dt;const fr=f.r*Math.min(1,f.t/.3);for(const e of S.en){if(e.hp<=0||f.h.has(e))continue;const dx=e.x-f.x,dy=e.y-f.y,d=Math.hypot(dx,dy)||1;if(d>fr+14)continue;let da=Math.abs(Math.atan2(dy,dx)-f.a);if(da>Math.PI)da=6.283-da;if(da<.88||d<30){f.h.add(e);hit(e,f.dd);if(S.nps){const p=C.pushBase*.1*S.nps;e.x+=dx/d*p;e.y+=dy/d*p}if(S.nbl&&e.hp>0)e.bl={d:f.dd*.01*S.nbl,c:e.bl?e.bl.c:0}}}}S.sl=S.sl.filter(f=>f.t<.4);cull(S.tx,t=>t.t>0);if(S.tx.length>30)S.tx.splice(0,S.tx.length-30);
 if(S.hp<=0){S.hp=0;hud(1);over();return}
 if(S.xp>=need()){levelUp()}
 hud()}
// ===== Draw =====
function draw(){
 // Isometric view: the game logic stays on a flat ground plane; only the drawing is projected (2:1 diamond tiles, upright sprites)
 const SX=(x,y)=>W/2+((x-S.x)-(y-S.y)),SY=(x,y)=>H/2+((x-S.x)+(y-S.y))*.5;
 g.fillStyle='#8a8da3';g.fillRect(0,0,W,H);
 const T=80,B=W/4+H/2+T,i0=Math.floor((S.x-B)/T),i1=Math.ceil((S.x+B)/T),j0=Math.floor((S.y-B)/T),j1=Math.ceil((S.y+B)/T);
 g.fillStyle='#9496ab';
 for(let i=i0;i<i1;i++)for(let j=j0;j<j1;j++){const ax=SX(i*T,j*T),ay=SY(i*T,j*T);if(ax<-T||ax>W+T||ay<-T||ay>H)continue;if((i+j)&1){g.beginPath();g.moveTo(ax,ay);g.lineTo(ax+T,ay+T/2);g.lineTo(ax,ay+T);g.lineTo(ax-T,ay+T/2);g.fill()}}
 g.strokeStyle='#ffffff30';g.lineWidth=1.5;g.beginPath();
 for(let i=i0;i<i1;i++)for(let j=j0;j<j1;j++){const ax=SX(i*T,j*T),ay=SY(i*T,j*T);if(ax<-T||ax>W+T||ay<-T||ay>H)continue;g.moveTo(ax-T,ay+T/2);g.lineTo(ax,ay);g.lineTo(ax+T,ay+T/2)}
 g.stroke();
 for(const m of S.gm){const x=SX(m.x,m.y),y=SY(m.x,m.y);if(x<-10||x>W+10||y<-10||y>H+10)continue;g.fillStyle='#7be04a';g.beginPath();g.moveTo(x,y-11);g.lineTo(x+5,y-5);g.lineTo(x,y+1);g.lineTo(x-5,y-5);g.fill()}
 const px=W/2,py=H/2,by=py-30;
 const dE=e=>{const x=SX(e.x,e.y),yb=SY(e.x,e.y),y=yb-18;if(x<-40||x>W+40||y<-50||y>H+40)return;
  g.fillStyle='#0003';g.beginPath();g.ellipse(x,yb-2,13,6,0,0,6.3);g.fill();
  g.fillStyle=e.fl>0?'#fff':e.rg?'#a66fe0':'#86c46b';g.fillRect(x-12,y-16,24,18);g.fillStyle=e.fl>0?'#fff':e.rg?'#4a2f7a':'#3d6db8';g.fillRect(x-12,y+2,24,14);
  g.fillStyle='#111';g.fillRect(x-7,y-9,4,5);g.fillRect(x+3,y-9,4,5);g.fillRect(x-4,y-1,8,2);
  const mh=e.mx;if(e.hp<mh){g.fillStyle='#000a';g.fillRect(x-12,y-24,24,4);g.fillStyle='#ff5d63';g.fillRect(x-12,y-24,24*e.hp/mh,4)}
  if(e.bl){g.strokeStyle='rgba(230,30,50,'+(.6+.3*Math.sin(S.t*12))+')';g.lineWidth=2;g.strokeRect(x-13,y-17,26,34);g.drawImage(SPR.d,x-12,y-45+Math.sin(S.t*8)*2,24,24)}};
 const dP=()=>{
  g.fillStyle='#4be06a33';g.strokeStyle='#4be06a';g.lineWidth=3;g.beginPath();g.ellipse(px,py,40,20,0,0,6.3);g.fill();g.stroke();
  if(S.sh>0){g.strokeStyle='#6ab7ff';g.lineWidth=4;g.beginPath();g.ellipse(px,py,48,24,0,0,6.3);g.stroke()}
  {let th=S.fd===undefined?Math.PI/2:S.fd;{const t=nearest(S.x,S.y,520);if(t){const a=Math.atan2(t.y-S.y,t.x-S.x);th=Math.atan2((Math.cos(a)+Math.sin(a))*.5,Math.cos(a)-Math.sin(a))}}
   const fi=((Math.round((th-Math.PI/2)/(Math.PI/4))%8)+8)%8,dw=ROBO.cw*ROBO.sc,dh=ROBO.ch*ROBO.sc,bob=Math.sin(S.t*4)*2;
   if(IMG.r.naturalWidth)g.drawImage(IMG.r,fi*ROBO.cw,0,ROBO.cw,ROBO.ch,px-dw/2,py-4-dh+bob,dw,dh)}
  if(S.wp==='sword'){const p=1-S.sw/(S.sdur||.22),a=S.sw>0?S.sa+(S.sd||1)*C.arc*(2*p*p*(3-2*p)-1):(S.ba||0),sdx=Math.cos(a)-Math.sin(a),sdy=(Math.cos(a)+Math.sin(a))*.5,f=Math.hypot(sdx,sdy),Rr=C.swordR*(1+.5*S.sr),bl=Math.max(8,(Rr-24)*f),sw0=S.sw>0;
   g.save();g.translate(px,by);g.rotate(Math.atan2(sdy,sdx)-Math.PI/2);g.translate(0,8);g.lineCap='round';
   
   g.lineCap='butt';
   if(IMG.b.naturalWidth&&IMG.h.naturalWidth){g.drawImage(IMG.b,-8.6,37.5,17.5,bl+1);g.drawImage(IMG.h,-8.6,0,17.5,38.5)}g.restore()}
  
  g.fillStyle='#000a';g.fillRect(px-20,py+16,40,6);g.fillStyle='#6be06a';g.fillRect(px-20,py+16,40*S.hp/maxHp(),6)};
 // depth order: enemies behind the player first, then the player, then enemies in front
 const ps=S.x+S.y;S.en.sort((a,b)=>(a.x+a.y)-(b.x+b.y));let k=0;
 for(;k<S.en.length&&S.en[k].x+S.en[k].y<ps;k++)dE(S.en[k]);
 dP();
 for(;k<S.en.length;k++)dE(S.en[k]);
 for(const p of S.tr){g.fillStyle='rgba('+p.c+','+p.t/p.m*.6+')';g.beginPath();g.arc(SX(p.x,p.y),SY(p.x,p.y)-18,p.r*p.t/p.m,0,6.3);g.fill()}
 for(const f of S.fx){if(f.d)continue;const p=1-f.t/.3,s=f.r*2.9*(.6+.4*p);g.globalAlpha=Math.min(1,f.t/.15);g.drawImage(SPR.x,SX(f.x,f.y)-s/2,SY(f.x,f.y)-s/2-10,s,s);g.globalAlpha=1}
 for(const m of S.ms){g.save();g.translate(SX(m.x,m.y),SY(m.x,m.y)-18);g.rotate(Math.atan2((m.vx+m.vy)*.5,m.vx-m.vy)+C.rocketRot);g.drawImage(SPR.r,-24,-24,48,48);g.restore()}
 g.fillStyle='#ff4df0';g.strokeStyle='#fff';g.lineWidth=3;for(const b of S.eb){g.beginPath();g.arc(SX(b.x,b.y),SY(b.x,b.y)-18,7,0,6.3);g.fill();g.stroke()}
 for(const b of S.bl){const x=SX(b.x,b.y),y=SY(b.x,b.y)-18;if(x<-30||x>W+30||y<-30||y>H+30)continue;g.save();g.translate(x,y);g.rotate(Math.atan2((b.vx+b.vy)*.5,b.vx-b.vy));g.drawImage(SPR.b,-20,-20,40,40);g.restore()}
 g.lineCap='round';for(const p of S.dtr){const k2=p.t/.4,al=k2*.9;g.strokeStyle='rgba(200,235,255,'+al+')';g.lineWidth=16*k2+2;g.beginPath();g.moveTo(SX(p.x0,p.y0),SY(p.x0,p.y0)-10);g.lineTo(SX(p.x1,p.y1),SY(p.x1,p.y1)-10);g.stroke();g.strokeStyle='rgba(255,255,255,'+al+')';g.lineWidth=5*k2+1;g.beginPath();g.moveTo(SX(p.x0,p.y0),SY(p.x0,p.y0)-10);g.lineTo(SX(p.x1,p.y1),SY(p.x1,p.y1)-10);g.stroke()}g.lineCap='butt';
 g.font='20px "Lilita One",Arial';g.textAlign='center';g.lineWidth=4;g.strokeStyle='#000';
 for(const t of S.tx){const x=SX(t.x,t.y),y=SY(t.x,t.y)-30-(.6-t.t)*50;g.fillStyle=t.p?'#ff6b6b':'#fff';g.strokeText(t.s,x,y);g.fillText(t.s,x,y)}
 if(S.hf>0){const gr=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.hypot(W,H)/2);gr.addColorStop(0,'rgba(255,0,0,0)');gr.addColorStop(1,'rgba(255,40,40,'+S.hf*2+')');g.fillStyle=gr;g.fillRect(0,0,W,H)}
 if(joy){g.strokeStyle='#fff9';g.lineWidth=3;g.beginPath();g.arc(joy.x0,joy.y0,50,0,6.3);g.stroke();
  const dx=joy.x-joy.x0,dy=joy.y-joy.y0,l=Math.min(Math.hypot(dx,dy),50)||0,a=Math.atan2(dy,dx);g.fillStyle='#fffb';g.beginPath();g.arc(joy.x0+Math.cos(a)*l,joy.y0+Math.sin(a)*l,20,0,6.3);g.fill()}}

// ===== Loop =====
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(S.state==='play')update(dt);draw();requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);
</script></body></html>
