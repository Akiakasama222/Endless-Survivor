<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Limbo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Limbo: Oblivion Survivor - survive the endless horde as a hooded mage.">
<meta name="theme-color" content="#272652">

<!-- Icon (browser tab, bookmarks, "Add to Home Screen") and the app manifest. The pictures are in assets/icons -->
<link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Limbo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="assets/fonts/PixelifySans.ttf" as="font" type="font/ttf" crossorigin>
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<!-- Loading screen: covers the game until the images are ready (see js/loader.js) -->
<div id="loading" role="status" aria-label="Loading">
  <div class="ld-title">Limbo</div>
  <div class="ld-play">
    <div class="ld-sprite ld-zombie" id="ldZombie"></div>
    <div class="ld-sprite ld-mage"></div>
    <div class="ld-track"><i id="ldFill"></i></div>
  </div>
  <div class="ld-ver" id="ldVer"></div>
</div>

<!-- Game screen (everything is drawn on this canvas) -->
<canvas id="c"></canvas>
<div id="hud">
<div id="row"><span id="lv">Lv 1</span><span id="time">00:00</span><span id="kl">0 kills</span></div>
<div class="bar"><i id="xpf"></i></div>
<div class="bar" id="hpb"><i id="hpf" style="width:100%"></i></div>
<div id="hpt"></div>
<div id="cds">
<div class="cd" id="cdd"><i></i><span></span></div>
<div class="cd" id="cdm"><i></i><span></span></div></div></div>

<button id="pb" aria-label="Menu">☰</button>
<button id="al" aria-label="Auto Upgrade">🔓</button>
<div id="warn"><b id="wb">⚠ WARNING ⚠</b><span id="wt"></span></div>
<div id="bb"><span>Giant Zombie</span>
<div class="bar"><i id="bbf"></i></div></div>
<!-- Story mode controls (see js/story.js): left stick = move, right stick = aim and attack, three skill buttons -->
<div id="sctl">
  <div id="sjm" class="sj sjmove" aria-label="Move stick">
    <svg viewBox="0 0 120 120" aria-hidden="true"><g fill="currentColor"><path d="M60 3l12 15H48z"/><path d="M60 117l12-15H48z"/><path d="M3 60l15-12v24z"/><path d="M117 60l-15-12v24z"/><path d="M20 20l17 5-12 12z"/><path d="M100 20l-5 17-12-12z"/><path d="M20 100l5-17 12 12z"/><path d="M100 100l-17-5 12-12z"/></g></svg>
    <div class="sjk"></div>
  </div>
  <div id="sr">
    <div id="sja" class="sj sjaim" aria-label="Aim stick"><div class="sjk"></div></div>
    <div class="sk" id="sk0"><i></i><b></b><span></span></div>
    <div class="sk" id="sk1"><i></i><b></b><span></span></div>
    <div class="sk" id="sk2"><i></i><b></b><span></span></div>
  </div>
</div>
<div id="ov"></div>

<!--
  Game code. The scripts share one global scope and MUST stay in this order
  (each file only uses things defined in the files above it, or inside functions that run later).
  Images and sounds are loaded from the assets/ folder, so serve the folder over http
  (for example: python3 -m http.server) instead of opening index.html straight from disk.
-->
<script src="js/version.js"></script>
<script src="js/loader.js"></script>
<script src="js/config.js"></script>
<script src="js/tuning.js"></script>
<script src="js/sprites.js"></script>
<script src="js/mage3d.js"></script>
<script src="js/audio.js"></script>
<script src="js/settings.js"></script>
<script src="js/buildings.js"></script>
<script src="js/biome.js"></script>
<script src="js/trees.js"></script>
<script src="js/chests.js"></script>
<script src="js/orbs.js"></script>
<script src="js/atmosphere.js"></script>
<script src="js/daynight.js"></script>
<script src="js/craters.js"></script>
<script src="js/state.js"></script>
<script src="js/player-data.js"></script>
<script src="js/editor.js"></script>
<script src="js/input.js"></script>
<script src="js/story.js"></script>
<script src="js/combat.js"></script>
<script src="js/boss.js"></script>
<script src="js/hud.js"></script>
<script src="js/grimoire.js"></script>
<script src="js/teleport.js"></script>
<script src="js/levelup.js"></script>
<script src="js/menus.js"></script>
<script src="js/feedback.js"></script>
<script src="js/update.js"></script>
<script src="js/draw.js"></script>
<script src="js/main.js"></script>
</body>
</html>
